aid: google-ad-manager
name: Google Ad Manager
description: >-
  The Google Ad Manager API provides programmatic access to manage Ad Manager data including ad units, companies,
  orders, placements, line items, creatives, reports, and targeting. It enables publishers to automate their ad
  operations and integrate Ad Manager with other systems.
