naftiko: 1.0.0-alpha2
info:
  label: Google Ad Manager API
  description: The Google Ad Manager API provides programmatic access to manage Ad Manager data including networks, ad units,
    companies, orders, placements, line items, creatives, reports, and targeting configurations.
  tags:
  - Google
  - Ad
  - Manager
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: google-ad-manager
    baseUri: https://admanager.googleapis.com
    description: Google Ad Manager API HTTP API.
    authentication:
      type: bearer
      token: '{{GOOGLE_AD_MANAGER_TOKEN}}'
    resources:
    - name: v1-networks
      path: /v1/networks
      operations:
      - name: listnetworks
        method: GET
        description: Google Ad Manager List networks
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-parent-adunits
      path: /v1/{parent}/adUnits
      operations:
      - name: listadunits
        method: GET
        description: Google Ad Manager List ad units
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
        - name: pageSize
          in: query
          type: integer
        - name: pageToken
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-parent-orders
      path: /v1/{parent}/orders
      operations:
      - name: listorders
        method: GET
        description: Google Ad Manager List orders
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-parent-companies
      path: /v1/{parent}/companies
      operations:
      - name: listcompanies
        method: GET
        description: Google Ad Manager List companies
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: v1-parent-reports-run
      path: /v1/{parent}/reports:run
      operations:
      - name: runreport
        method: POST
        description: Google Ad Manager Run a report
        inputParameters:
        - name: parent
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: google-ad-manager-rest
    description: REST adapter for Google Ad Manager API.
    resources:
    - path: /v1/networks
      name: listnetworks
      operations:
      - method: GET
        name: listnetworks
        description: Google Ad Manager List networks
        call: google-ad-manager.listnetworks
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{parent}/adUnits
      name: listadunits
      operations:
      - method: GET
        name: listadunits
        description: Google Ad Manager List ad units
        call: google-ad-manager.listadunits
        with:
          parent: rest.parent
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{parent}/orders
      name: listorders
      operations:
      - method: GET
        name: listorders
        description: Google Ad Manager List orders
        call: google-ad-manager.listorders
        with:
          parent: rest.parent
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{parent}/companies
      name: listcompanies
      operations:
      - method: GET
        name: listcompanies
        description: Google Ad Manager List companies
        call: google-ad-manager.listcompanies
        with:
          parent: rest.parent
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/{parent}/reports:run
      name: runreport
      operations:
      - method: POST
        name: runreport
        description: Google Ad Manager Run a report
        call: google-ad-manager.runreport
        with:
          parent: rest.parent
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: google-ad-manager-mcp
    transport: http
    description: MCP adapter for Google Ad Manager API for AI agent use.
    tools:
    - name: listnetworks
      description: Google Ad Manager List networks
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-ad-manager.listnetworks
      outputParameters:
      - type: object
        mapping: $.
    - name: listadunits
      description: Google Ad Manager List ad units
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-ad-manager.listadunits
      with:
        parent: tools.parent
        pageSize: tools.pageSize
        pageToken: tools.pageToken
      inputParameters:
      - name: parent
        type: string
        description: parent
        required: true
      - name: pageSize
        type: integer
        description: pageSize
      - name: pageToken
        type: string
        description: pageToken
      outputParameters:
      - type: object
        mapping: $.
    - name: listorders
      description: Google Ad Manager List orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-ad-manager.listorders
      with:
        parent: tools.parent
      inputParameters:
      - name: parent
        type: string
        description: parent
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: listcompanies
      description: Google Ad Manager List companies
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: google-ad-manager.listcompanies
      with:
        parent: tools.parent
      inputParameters:
      - name: parent
        type: string
        description: parent
        required: true
      outputParameters:
      - type: object
        mapping: $.
    - name: runreport
      description: Google Ad Manager Run a report
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: google-ad-manager.runreport
      with:
        parent: tools.parent
      inputParameters:
      - name: parent
        type: string
        description: parent
        required: true
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    GOOGLE_AD_MANAGER_TOKEN: GOOGLE_AD_MANAGER_TOKEN
